run-check:
    if: github.event.schedule == '*/10 12-21 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /run-check en Render
        run: |
          codigo=$(curl -s -o respuesta.txt -w "%{http_code}" "https://ipsa-alert-service.onrender.com/run-check?token=${{ secrets.CHECK_SECRET }}")
          echo "HTTP status: $codigo"
          cat respuesta.txt
          if [ "$codigo" -ge 400 ]; then exit 1; fi
