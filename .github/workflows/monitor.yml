name: Monitoreo IPSA

on:
  schedule:
    # /run-check: cada 10 minutos, lunes a viernes, 12:00-21:00 UTC.
    # Cubre con margen el horario de la Bolsa de Santiago (9:30-16:00 Chile).
    # Sigue corriendo tan seguido como antes -- ya NO manda correo por cada
    # cruce (eso lo hace /enviar-digesto mas abajo), asi que no hay costo en
    # mantenerlo frecuente: es lo que evita perder un cruce breve.
    - cron: '*/10 12-21 * * 1-5'

    # /enviar-digesto: UN correo consolidado con todo lo acumulado desde el
    # ultimo envio (ver _alertas_pendientes en server.py), a horas fijas en
    # vez de un correo por cada alerta -- esto es lo que reemplaza los 100+
    # correos de un dia de mercado movido.
    #
    # Cada 10 minutos, dentro de una ventana ancha en UTC que cubre 9:00-18:00
    # Chile TANTO en horario de invierno (UTC-4, 13-22 UTC) COMO en horario de
    # verano (UTC-3, 12-21 UTC) -- por eso el rango va de 12 a 22 UTC. El
    # servidor (server.py, usando zoneinfo con la hora real de Chile) es quien
    # decide adentro si "ahora" es una hora en punto valida y si ya se mando
    # el correo de esa hora -- por eso llamarlo cada 10 min no genera correos
    # de mas. Con esto, el cambio de hora de Chile (2 veces al año) YA NO
    # requiere tocar este archivo nunca mas.
    - cron: '*/10 12-22 * * 1-5'

    # /resumen-diario: una vez al dia, ~16:00-16:59 hora Chile (ver
    # HORA_RESUMEN_DIARIO_CHILE en server.py). 16 Chile es 20 UTC en invierno
    # y 19 UTC en verano, asi que la ventana cubre 19-20 UTC cada 10 min; el
    # servidor decide adentro la hora exacta y evita reenvios el mismo dia.
    # Mismo motivo que arriba: no depende del cambio de horario de Chile.
    - cron: '*/10 19-20 * * 1-5'
    # Apagar/encender el servicio de Render el fin de semana. La Bolsa esta
    # cerrada y NINGUN cron de arriba corre sabado ni domingo (todos terminan
    # en "* * 1-5"), asi que suspender no hace perder ni un cruce ni un
    # digesto. Un servicio suspendido NO consume horas gratis de Render, y
    # con esto los 5 dias habiles quedan encendidos 24/7: 22 x 24 = 528 h,
    # comodamente bajo el tope de 750 h/mes del plan gratuito.
    - cron: '17 23 * * 5'   # viernes 23:17 UTC = 19:17 Chile (20:17 en verano)
    - cron: '17 10 * * 1'   # lunes   10:17 UTC = 06:17 Chile (07:17 en verano)

    # ---- Ventana unica de fin de semana (septiembre 2026) ----
    # POR QUE CAMBIO. Antes habia tres ventanas de una hora (10:00, 13:00 y
    # 17:00 de Chile). No funcionaron. GitHub Actions, en el plan gratuito,
    # NO garantiza la hora del cron: encola los trabajos y los suelta cuando
    # hay maquinas libres. Medido en este mismo repo:
    #   - domingo 30-08-2026, cron '0 17 * * 6,0' -> corrio 17:59 UTC (+59 min)
    #   - domingo 30-08-2026, cron '0 21 * * 6,0' -> corrio 23:18 UTC (+2 h 18)
    #   - domingo 30-08-2026, cron '0 22 * * 6,0' -> corrio 00:11 UTC del lunes
    #   - lunes   31-08-2026, cron '0 11 * * 1'   -> no corrio en toda la manana
    # Con ventanas de UNA hora, un atraso asi las deja fuera de lugar: el
    # servicio despertaba cuando ya no servia (o no despertaba).
    #
    # QUE SE HACE AHORA. Una sola ventana larga por dia: se enciende
    # temprano y se apaga en la tarde. Aunque GitHub se atrase dos horas, la
    # ventana igual cubre las 10:00, las 13:00 y las 17:00 de Chile. Ademas
    # hay un segundo "despertar" a media manana que no hace nada si el
    # servicio ya esta arriba, y que lo salva si el primero no corrio.
    #
    # NADA EN EL MINUTO 0. El minuto en punto es el mas congestionado de
    # GitHub (es donde programa todo el mundo). Por eso ningun cron nuevo de
    # este archivo cae en el minuto 0.
    #
    # COSTO EN HORAS GRATIS. ~11 h por dia x 2 dias = 22 h por fin de
    # semana, ~95 h al mes. Sumado a los dias habiles encendidos 24/7
    # (~470 h) da ~565 h, comodamente bajo el tope de 750 h/mes del plan
    # gratuito de Render.
    - cron: '13 11 * * 6,0'   # despertar  · 11:13 UTC = 07:13 Chile (08:13 en verano)
    - cron: '43 15 * * 6,0'   # reasegurar · por si el despertar de arriba no corrio
    - cron: '13 22 * * 6,0'   # suspender  · 22:13 UTC = 18:13 Chile (19:13 en verano)

  # Boton manual: GitHub -> Actions -> Monitoreo IPSA -> "Run workflow".
  # Sirve para encender el servicio a mano cuando GitHub se atrasa con el
  # cron, sin tener que entrar a Render. "revisar" es lo que hacia antes.
  workflow_dispatch:
    inputs:
      accion:
        description: 'Que hacer'
        type: choice
        default: 'revisar'
        options:
          - revisar
          - despertar
          - suspender

jobs:
  run-check:
    if: >-
      github.event.schedule == '*/10 12-21 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && inputs.accion == 'revisar')
    runs-on: ubuntu-latest
    steps:
      # RED DE SEGURIDAD (agregada el 31-08-2026).
      # Si el servicio quedo suspendido en un dia habil -- por ejemplo
      # porque GitHub no disparo a la hora el cron del lunes, que fue
      # exactamente lo que paso ese dia -- este paso lo enciende solo.
      # Como run-check corre cada 10 minutos, cualquier "despertar"
      # perdido se corrige solo en 10 minutos, en vez de dejar la app sin
      # datos hasta que alguien se de cuenta.
      - name: Asegurar que el servicio este encendido
        run: |
          BASE="https://ipsa-alert-service.onrender.com"
          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$BASE/quotes" || echo "000")
          echo "estado inicial de /quotes -> $codigo"
          if [ "$codigo" = "200" ]; then
            echo "El servicio ya estaba arriba; nada que hacer."
            exit 0
          fi
          echo "No responde. Se pide reanudarlo en Render."
          codigo=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/resume")
          echo "resume -> $codigo (400 = ya estaba activo)"
          for i in $(seq 1 20); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$BASE/quotes" || echo "000")
            echo "intento $i -> $codigo"
            if [ "$codigo" = "200" ]; then break; fi
            sleep 15
          done

      - name: Llamar a /run-check en Render
        run: |
          codigo=$(curl -s -o respuesta.txt -w "%{http_code}" \
            "https://ipsa-alert-service.onrender.com/run-check?token=${{ secrets.CHECK_SECRET }}")
          echo "HTTP status: $codigo"
          cat respuesta.txt
          echo ""
          if [ "$codigo" -ge 400 ]; then exit 1; fi

  digesto-alertas:
    if: >-
      github.event.schedule == '*/10 12-22 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && inputs.accion == 'revisar')
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /enviar-digesto en Render
        run: |
          codigo=$(curl -s -o respuesta.txt -w "%{http_code}" \
            "https://ipsa-alert-service.onrender.com/enviar-digesto?token=${{ secrets.CHECK_SECRET }}")
          echo "HTTP status: $codigo"
          cat respuesta.txt
          echo ""
          if [ "$codigo" -ge 400 ]; then exit 1; fi

  resumen-diario:
    if: >-
      github.event.schedule == '*/10 19-20 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && inputs.accion == 'revisar')
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /resumen-diario en Render
        run: |
          codigo=$(curl -s -o respuesta.txt -w "%{http_code}" \
            "https://ipsa-alert-service.onrender.com/resumen-diario?token=${{ secrets.CHECK_SECRET }}")
          echo "HTTP status: $codigo"
          cat respuesta.txt
          echo ""
          if [ "$codigo" -ge 400 ]; then exit 1; fi

  guardar-ipsa-historico:
    # Mismo horario que resumen-diario (una vez al dia habil, al cierre de
    # la Bolsa de Santiago) -- no hace falta un cron aparte. El servidor
    # decide adentro (via /ipsa-valor-hoy) si ya hay dato de hoy; este job
    # ademas es idempotente por su cuenta (revisa el CSV antes de escribir),
    # asi que no importa que la ventana llame varias veces cada 10 minutos.
    if: >-
      github.event.schedule == '*/10 19-20 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && inputs.accion == 'revisar')
    runs-on: ubuntu-latest
    # Necesario para que el GITHUB_TOKEN automatico de este job pueda hacer
    # commit y push al propio repo (ipsa-alert-service). Si el repo tiene
    # "Read and write permissions" activado en Settings -> Actions ->
    # General -> Workflow permissions, esta linea es redundante pero no
    # molesta; si NO esta activado, esta linea es la que lo habilita solo
    # para este job, sin tener que tocar la configuracion general del repo.
    permissions:
      contents: write
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Pedir el valor de IPSA de hoy al backend
        id: valor
        run: |
          resp=$(curl -s "https://ipsa-alert-service.onrender.com/ipsa-valor-hoy?token=${{ secrets.CHECK_SECRET }}")
          echo "Respuesta: $resp"
          estado=$(python3 -c "import json,sys; print(json.loads('''$resp''').get('estado',''))" 2>/dev/null || echo "")
          if [ "$estado" != "ok" ]; then
            echo "Sin dato valido todavia (estado='$estado'); no se guarda nada esta vuelta."
            echo "hay_dato=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fecha=$(python3 -c "import json; print(json.loads('''$resp''')['fecha'])")
          valor=$(python3 -c "import json; print(json.loads('''$resp''')['valor'])")
          echo "fecha=$fecha" >> "$GITHUB_OUTPUT"
          echo "valor=$valor" >> "$GITHUB_OUTPUT"
          echo "hay_dato=true" >> "$GITHUB_OUTPUT"

      - name: Agregar la fila al CSV si no esta ya
        if: steps.valor.outputs.hay_dato == 'true'
        run: |
          ARCHIVO="backend/ipsa_historico.csv"
          FECHA="${{ steps.valor.outputs.fecha }}"
          VALOR="${{ steps.valor.outputs.valor }}"
          if grep -q "^${FECHA};" "$ARCHIVO"; then
            echo "Ya hay una fila para $FECHA en el CSV; no se duplica."
            exit 0
          fi
          # Se inserta justo despues del encabezado (linea 1), no al final:
          # el archivo viene ordenado de mas nuevo a mas viejo (ver
          # ipsa_historico.py), y hoy siempre es el dato mas nuevo de todos.
          sed -i "1a ${FECHA};${VALOR}" "$ARCHIVO"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$ARCHIVO"
          git commit -m "IPSA $FECHA: $VALOR (automatico via monitor.yml)"
          git push

  # Estos dos jobs NO llevan "|| github.event_name == 'workflow_dispatch'" a
  # proposito: si lo llevaran, probar el workflow a mano desde GitHub
  # suspenderia el servicio sin querer.
  suspender-fin-de-semana:
    if: github.event.schedule == '17 23 * * 5'
    runs-on: ubuntu-latest
    steps:
      - name: Suspender el servicio en Render
        run: |
          codigo=$(curl -s -o respuesta.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/suspend")
          echo "HTTP status: $codigo"
          cat respuesta.txt
          echo ""
          if [ "$codigo" -ge 300 ]; then exit 1; fi

  # ---- Ventana de fin de semana (ver los cron de arriba) ----
  # Estos dos SI se pueden correr a mano, pero solo eligiendo "despertar" o
  # "suspender" en el boton Run workflow. Con la opcion por defecto
  # ("revisar") no se tocan, asi que probar el workflow a mano no enciende
  # ni apaga el servicio sin querer.
  despertar-fin-de-semana:
    if: >-
      github.event.schedule == '13 11 * * 6,0' ||
      github.event.schedule == '43 15 * * 6,0' ||
      (github.event_name == 'workflow_dispatch' && inputs.accion == 'despertar')
    runs-on: ubuntu-latest
    steps:
      - name: Reanudar el servicio en Render
        run: |
          codigo=$(curl -s -o respuesta.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/resume")
          echo "HTTP status: $codigo"
          cat respuesta.txt
          echo ""
          # 400 = ya estaba activo (por ejemplo si lo encendiste a mano).
          # No es un fallo: igual queremos calentar la cache mas abajo.
          if [ "$codigo" = "400" ]; then
            echo "El servicio ya estaba activo; se sigue igual."
          elif [ "$codigo" -ge 300 ]; then
            exit 1
          fi

      # Reanudar devuelve enseguida, pero el contenedor tarda en levantar.
      # Sin esto, la primera consulta que haga Cristian al abrir la app se
      # come el arranque completo (medio minuto o mas). Calentar la cache
      # aca hace que, cuando abra la app dentro de la hora, responda al tiro.
      - name: Esperar a que levante y calentar la cache de precios
        run: |
          BASE="https://ipsa-alert-service.onrender.com"
          arriba=0
          for i in $(seq 1 20); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$BASE/quotes" || echo "000")
            echo "intento $i -> $codigo"
            if [ "$codigo" = "200" ]; then arriba=1; break; fi
            sleep 15
          done
          if [ "$arriba" != "1" ]; then
            echo "El servicio no respondio a tiempo; queda encendido igual y la app lo va a despertar sola."
            exit 0
          fi
          # /quotes ya quedo caliente con el intento que devolvio 200.
          # Falta el lote de EE.UU. (y con el, bitcoin, que es lo unico que
          # de verdad se mueve el fin de semana).
          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$BASE/quotes-usa" || echo "000")
          echo "/quotes-usa -> $codigo"

  suspender-ventana-fin-de-semana:
    if: >-
      github.event.schedule == '13 22 * * 6,0' ||
      (github.event_name == 'workflow_dispatch' && inputs.accion == 'suspender')
    runs-on: ubuntu-latest
    steps:
      - name: Volver a suspender el servicio en Render
        run: |
          codigo=$(curl -s -o respuesta.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/suspend")
          echo "HTTP status: $codigo"
          cat respuesta.txt
          echo ""
          # 400 = ya estaba suspendido. No es un fallo: es justo el estado
          # que queriamos dejar.
          if [ "$codigo" = "400" ]; then
            echo "El servicio ya estaba suspendido; nada que hacer."
            exit 0
          fi
          if [ "$codigo" -ge 300 ]; then exit 1; fi

  reanudar-lunes:
    if: github.event.schedule == '17 10 * * 1'
    runs-on: ubuntu-latest
    steps:
      - name: Reanudar el servicio en Render
        run: |
          codigo=$(curl -s -o respuesta.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/resume")
          echo "HTTP status: $codigo"
          cat respuesta.txt
          echo ""
          # 400 = "no estaba suspendido" (por ejemplo si lo reanudaste a mano
          # antes). Eso NO es un fallo: el servicio esta arriba igual.
          if [ "$codigo" = "400" ]; then
            echo "El servicio ya estaba activo; nada que hacer."
            exit 0
          fi
          if [ "$codigo" -ge 300 ]; then exit 1; fi
